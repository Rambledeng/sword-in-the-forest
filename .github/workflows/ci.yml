name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SwordInTheForest.sln -c Debug

      # Includes M2's "Done when" checks on 1,000 simulated players (tests/Director.Tests/DoneWhenTests.cs).
      - name: Unit tests
        run: dotnet test SwordInTheForest.sln --no-build --logger "console;verbosity=minimal"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          mkdir -p ~/godot && cd ~/godot
          for repo in godot-builds godot; do
            curl -fsSL -o godot.zip "https://github.com/godotengine/${repo}/releases/download/${GODOT_VERSION}-stable/${name}.zip" && break
          done
          unzip -q godot.zip && rm godot.zip

      # Every scene in game/scenes/scenarios/: the bot tests (right response at 150 ms, never
      # responding, guarding red, mashing), the duel to a finisher, simulated gamepad and
      # keyboard/mouse input, the F1 panel, boot, localization, and the director on and off.
      - name: Headless scenarios
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/scenario.sh

      - name: Screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/screenshot.sh Title
          tools/screenshot.sh Title zh_CN 10 title_zh_CN
          tools/screenshot.sh screens/Showcase "" 6000 showcase_end
          tools/screenshot.sh screens/DirectorView "" 30 director_overlay

      # Long-running render check for the white-floor bug (GC forced every second).
      - name: Floor soak
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/screenshot.sh screens/FloorSoak "" 100000 soak_end

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-screens
          path: |
            .logs/
            docs/screens/
          if-no-files-found: ignore
          include-hidden-files: true  # .logs/ is hidden; without this the logs were never uploaded

  # A fresh clone opened in the Godot .NET editor on Windows must leave git clean. The editor
  # rewrites project.godot and every .import file on open, always with LF; .gitattributes keeps
  # the working tree LF so Git for Windows (core.autocrlf=true) sees no change.
  windows-editor-clean:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot (Windows)
        id: godot-win-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-win
          key: godot-${{ env.GODOT_VERSION }}-mono-win64

      - name: Install Godot (Windows)
        if: steps.godot-win-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_win64"
          mkdir -p ~/godot-win && cd ~/godot-win
          for repo in godot-builds godot; do
            curl -fsSL -o godot.zip "https://github.com/godotengine/${repo}/releases/download/${GODOT_VERSION}-stable/${name}.zip" && break
          done
          unzip -q godot.zip && rm godot.zip

      - name: Git settings
        run: |
          git config --show-origin --get-all core.autocrlf || echo "core.autocrlf unset"
          git config --show-origin --get-all core.eol || echo "core.eol unset"

      - name: Build
        run: dotnet build game/SwordInTheForest.csproj -nologo -v q

      - name: Open the project in the editor
        run: |
          exe=$(ls ~/godot-win/Godot_v${GODOT_VERSION}-stable_mono_win64/*_console.exe | head -1)
          mkdir -p .logs
          timeout 600 "$exe" --editor --path game --quit-after 1500 --rendering-driver opengl3_angle > .logs/windows-editor.log 2>&1 || echo "editor exit $?"
          tail -20 .logs/windows-editor.log

      - name: Git must be clean
        run: |
          git status --porcelain | tee .logs/windows-status.txt
          git diff > .logs/windows-diff.patch
          git ls-files --eol $(git diff --name-only) > .logs/windows-eol.txt 2>/dev/null || true
          head -60 .logs/windows-diff.patch
          test ! -s .logs/windows-status.txt

      - name: Upload editor logs and diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-editor
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore

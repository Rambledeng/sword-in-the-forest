name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SwordInTheForest.sln -c Debug

      - name: Unit tests
        run: dotnet test SwordInTheForest.sln --no-build --logger "console;verbosity=minimal"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          mkdir -p ~/godot && cd ~/godot
          for repo in godot-builds godot; do
            curl -fsSL -o godot.zip "https://github.com/godotengine/${repo}/releases/download/${GODOT_VERSION}-stable/${name}.zip" && break
          done
          unzip -q godot.zip && rm godot.zip

      # Every scene in game/scenes/scenarios/: the bot tests (right response at 150 ms, never
      # responding, guarding red, mashing), the duel to a finisher, simulated gamepad and
      # keyboard/mouse input, the F1 panel, boot and localization.
      - name: Headless scenarios
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/scenario.sh

      - name: Screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/screenshot.sh Title
          tools/screenshot.sh Title zh_CN 10 title_zh_CN
          tools/screenshot.sh screens/Showcase "" 6000 showcase_end

      # Long-running render check for the white-floor bug (GC forced every second).
      - name: Floor soak
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/screenshot.sh screens/FloorSoak "" 100000 soak_end

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-screens
          path: |
            .logs/
            docs/screens/
          if-no-files-found: ignore

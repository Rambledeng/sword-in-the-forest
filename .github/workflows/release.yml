name: Release

# A version tag (v0.1.0, v0.2.0, ...) exports the Windows and Linux builds, attaches them to a
# GitHub Release, and uploads them to itch.io with butler.
# Needs the repository secret BUTLER_API_KEY (itch.io → Settings → API keys).

on:
  push:
    tags: ["v*"]
  # Dry runs (export and smoke test only; the Release and itch.io steps need a tag):
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml", "game/export_presets.cfg", "game/project.godot"]

env:
  GODOT_VERSION: 4.7.2
  ITCH_TARGET: rambledeng/sword-in-the-forest
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

permissions:
  contents: write  # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Unit tests
        run: |
          dotnet build SwordInTheForest.sln -c Release -nologo -v q
          dotnet test SwordInTheForest.sln -c Release --no-build --logger "console;verbosity=minimal"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-templates

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dest"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          # Only the two platforms we ship (the archive holds every platform, about 1.2 GB).
          unzip -q -j templates.tpz 'templates/version.txt' 'templates/linux_*x86_64*' 'templates/windows_*x86_64*' -d "$dest"
          rm templates.tpz
          ls "$dest"

      - name: Export
        run: |
          godot="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          mkdir -p build/windows build/linux .logs
          # Godot's .NET export wants a solution beside the project (gitignored; the editor makes one).
          # SDK 9+ writes .slnx by default; Godot looks for .sln. (SDK 8 has no --format and writes .sln.)
          (cd game && { dotnet new sln -n SwordInTheForest -o . --format sln || dotnet new sln -n SwordInTheForest -o .; } \
            && dotnet sln SwordInTheForest.sln add SwordInTheForest.csproj)
          timeout 600 "$godot" --headless --path game --import > .logs/import.log 2>&1 || true
          timeout 600 "$godot" --headless --path game --export-release "Linux" ../build/linux/SwordInTheForest.x86_64 > .logs/export-linux.log 2>&1
          timeout 600 "$godot" --headless --path game --export-release "Windows" ../build/windows/SwordInTheForest.exe > .logs/export-windows.log 2>&1
          tail -5 .logs/export-*.log
          test -x build/linux/SwordInTheForest.x86_64
          test -f build/windows/SwordInTheForest.exe
          cp LICENSE CREDITS.md build/linux/
          cp LICENSE CREDITS.md build/windows/
          find build -maxdepth 2 | sort

      # The exported Linux build starts, and its developer tools (F1/F2/F3) are off.
      - name: Smoke test the Linux build
        run: |
          timeout 120 build/linux/SwordInTheForest.x86_64 --headless --quit-after 120 > .logs/smoke.log 2>&1 || true
          cat .logs/smoke.log
          grep -q "developer tools off" .logs/smoke.log

      - name: Zip
        run: |
          v="${{ steps.v.outputs.version }}"
          (cd build/windows && zip -qr "../SwordInTheForest-${v}-windows.zip" .)
          (cd build/linux && zip -qr "../SwordInTheForest-${v}-linux.zip" .)
          ls -l build/*.zip

      - name: Upload builds (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sword in the Forest ${{ github.ref_name }}
          body_path: docs/release_notes.md
          files: build/*.zip

      - name: Upload to itch.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Repository secret BUTLER_API_KEY is not set"; exit 1; fi
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
          v="${{ steps.v.outputs.version }}"
          ./butler/butler push build/windows "$ITCH_TARGET:windows" --userversion "$v"
          ./butler/butler push build/linux "$ITCH_TARGET:linux" --userversion "$v"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore
